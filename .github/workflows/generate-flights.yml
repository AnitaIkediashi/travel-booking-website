name: Generate Flight Data

on:
  schedule:
    - cron: '0 3 * * *'   # once daily, 3:00 AM UTC — adjust if you prefer a different time
  workflow_dispatch:        # lets you manually trigger a run from the Actions tab

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # generous headroom; your per-instance transactions are now
                              # small and fast, so a normal day should finish well under this

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run flight data seed script
        run: npx tsx create_data/flight_data.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}